<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        background-color: #1A1A24;
        color: #D4D4D8;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      .panel-title {
        background-color: #2D2B3A;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #FFFFFF;
        text-transform: uppercase;
        border-bottom: 1px solid #3E3B52;
        text-align: center;
      }
      #chat-container {
        flex-grow: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .message {
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        max-width: 85%;
        word-wrap: break-word;
      }
      .message.agent {
        background-color: #2D2B3A;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
      }
      .message.user {
        background-color: #4C4564;
        color: #FFFFFF;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
      }
      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .quick-action-btn {
        background-color: transparent;
        border: 1px solid #555361;
        color: #A09EB0;
        padding: 6px 12px;
        border-radius: 16px;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .quick-action-btn:hover {
        background-color: #3E3B52;
        color: #FFFFFF;
        border-color: #8C8A9E;
      }
      .input-wrapper {
        padding: 12px 16px;
        background-color: #2D2B3A;
        border-top: 1px solid #3E3B52;
        display: flex;
        gap: 8px;
      }
      textarea {
        flex-grow: 1;
        background-color: #1A1A24;
        border: 1px solid #3E3B52;
        border-radius: 6px;
        padding: 8px;
        color: #D4D4D8;
        font-size: 13px;
        resize: none;
        height: 38px;
        outline: none;
      }
      textarea:focus {
        border-color: #6B668A;
      }
      button#send-btn {
        background-color: #6B668A;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0 16px;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        text-transform: uppercase;
      }
      button#send-btn:hover {
        background-color: #4C4564;
      }
    </style>
  </head>
  <body>
    <div class="panel-title">Renovation Core Agent</div>
    <div id="chat-container"></div>
    <div class="input-wrapper">
      <textarea id="prompt-input" placeholder="Instruct the engine..."></textarea>
      <button id="send-btn" onclick="submitQuery()">Execute</button>
    </div>

    <script>
      let socket;
      const wsUrl = "wss://core-remodel-api.example.com/ai/agent";

      function initWebSocket() {
        appendMessage('agent', "Initializing secure connection to Edge Agent...");

        try {
          socket = new WebSocket(wsUrl);

          socket.onopen = function(e) {
            console.log("[open] Connection established");
          };

          socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'message') {
              appendMessage('agent', data.text);
              if (data.quickActions && data.quickActions.length > 0) {
                renderQuickActions(data.quickActions);
              }
              if (data.toolCall) {
                executeLocalTool(data.toolCall);
              }
            } else if (data.type === 'error') {
              appendMessage('agent', "ERROR: " + data.message);
            }
          };

          socket.onclose = function(event) {
            appendMessage('agent', "Connection terminated.");
          };

          socket.onerror = function(error) {
              console.log("WebSocket error, falling back to mock", error);
              fallbackMock();
          }

        } catch (e) {
            fallbackMock();
        }
      }

      function fallbackMock() {
        setTimeout(() => {
          appendMessage('agent', "System loaded. I am connected via WebSocket (mock fallback). How can I assist with your budgeting matrix parameters?");
          renderQuickActions(["Update a cost", "Review budget", "List inactive items"]);
        }, 500);
      }

      function appendMessage(role, text) {
        const container = document.getElementById('chat-container');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + role;
        msgDiv.innerText = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
      }

      function renderQuickActions(actions) {
        const container = document.getElementById('chat-container');
        const actionWrapper = document.createElement('div');
        actionWrapper.className = 'quick-actions';

        actions.forEach(action => {
          const btn = document.createElement('button');
          btn.className = 'quick-action-btn';
          btn.innerText = action;
          btn.onclick = () => {
             document.getElementById('prompt-input').value = action;
             submitQuery();
          };
          actionWrapper.appendChild(btn);
        });

        container.appendChild(actionWrapper);
        container.scrollTop = container.scrollHeight;
      }

      function executeLocalTool(toolCall) {
        appendMessage('agent', `Executing local structural modification: ${toolCall.action}`);
        google.script.run
          .withSuccessHandler(function(result) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'tool_result', result: JSON.parse(result) }));
            }
            appendMessage('agent', "Modification confirmed locally.");
          })
          .withFailureHandler(function(err) {
            appendMessage('agent', "Local modification failed: " + err.message);
          })
          .executeAgentCommand(JSON.stringify(toolCall));
      }

      function submitQuery() {
        const inputEl = document.getElementById('prompt-input');
        const query = inputEl.value.trim();

        if (!query) return;

        inputEl.value = '';
        appendMessage('user', query);

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'query', text: query }));
        } else {
            // Mock response if disconnected
            setTimeout(() => {
                appendMessage('agent', "Command transmitted. Processing request...");
                if (query.toLowerCase().includes("update")) {
                    executeLocalTool({ action: "UPDATE_CELL", params: { id: "brId_1", costExpression: "5000" } });
                }
            }, 1000);
        }
      }

      document.getElementById('prompt-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          submitQuery();
        }
      });

      window.onload = initWebSocket;
    </script>
  </body>
</html>

[app]
# Local-first config:
# - select providers, workspaces, models, and runtime options here
# - do not put provider API keys in this TOML by default
# - use each provider's local CLI login, bridge, or normal shell env instead
state_dir = "./.orchestrator-state"
concurrency = 4

[providers.codex]
kind = "codex"
model = "gpt-5.4"
sandbox = "workspace_write"
approval_mode = "auto_review"
system_prompt = "Act as a Principal Platform Engineer. Be direct and evidence-driven."

[providers.claude]
kind = "claude"
model = "sonnet"
permission_mode = "default"
max_turns = 40
system_prompt = "Act as a Principal Platform Engineer. Be direct and evidence-driven."

[providers.cursor]
kind = "cursor"
model = "composer-2.5"
system_prompt = "Act as a Principal Platform Engineer. Be direct and evidence-driven."

[providers.antigravity]
kind = "antigravity"
model = "gemini-2.5-pro"
system_prompt = "Act as a Principal Platform Engineer. Be direct and evidence-driven."

[workspaces.bridge-cse-016rp7ejtqbfmvtpux2cuvww]
path = "/Volumes/Projects/workers/core-remodel/.claude/worktrees/bridge-cse_016Rp7EJTqbFmvTpUX2cUvWw"
description = "Current working repository"

# Add more workspaces by copying the block above, for example:
# [workspaces.other_service]
# path = "/absolute/path/to/other-service"
# description = "Secondary service"

[profiles.default]
targets = [
  { provider = "codex", workspace = "bridge-cse-016rp7ejtqbfmvtpux2cuvww" },
  { provider = "claude", workspace = "bridge-cse-016rp7ejtqbfmvtpux2cuvww" },
  { provider = "cursor", workspace = "bridge-cse-016rp7ejtqbfmvtpux2cuvww" },
  { provider = "antigravity", workspace = "bridge-cse-016rp7ejtqbfmvtpux2cuvww" },
]

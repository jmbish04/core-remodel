<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contractor Portal · The Monolith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;1,16..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          serif: ['Newsreader', 'ui-serif', 'Georgia', 'serif']
        },
        colors: { 'zinc-850': '#1c1c1f' }
      }
    }
  }
</script>
<style>
  html, body { background: #09090b; color: #fafafa; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  ::selection { background: rgba(244,244,245,0.15); color: #fafafa; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  .font-mono { font-feature-settings: "tnum" 1; }
  /* Blinking marker on floor plans */
  .blink-dot {
    width: 14px;
    height: 14px;
    border-radius: 9999px;
    background: #ef4444;
    box-shadow: 0 0 0 2px rgba(239,68,68,0.9), 0 0 14px rgba(239,68,68,0.7);
    position: relative;
    z-index: 2;
  }
  .blink-halo {
    position: absolute;
    inset: -10px;
    border-radius: 9999px;
    background: radial-gradient(circle, rgba(239,68,68,0.55) 0%, rgba(239,68,68,0.0) 65%);
    animation: blink-halo 1.4s ease-out infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes blink-halo {
    0%   { transform: scale(0.55); opacity: 0.9; }
    100% { transform: scale(2.4);  opacity: 0;   }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
</head>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Recovery Remodel · Dialer</title>
<style>
  :root{
    --bg:#09090b; --panel:#0f0f12; --panel2:#141417; --border:#27272a;
    --fg:#fafafa; --muted:#a1a1aa; --muted2:#71717a;
    --accent:#6366f1; --accent-fg:#fff;
    --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --blue:#3b82f6;
    --radius:12px; --radius-sm:8px;
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}
  a{color:var(--blue);text-decoration:none}
  button{font:inherit;cursor:pointer;color:inherit}
  .nav{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);
    background:var(--panel);flex:0 0 auto}
  .nav .brand{font-weight:700;letter-spacing:-.01em}
  .nav .brand span{color:var(--muted2);font-weight:500}
  .nav .spacer{flex:1}
  .nav .doclink{font-size:12px;color:var(--muted);padding:4px 8px;border:1px solid var(--border);border-radius:999px}
  .nav .doclink:hover{color:var(--fg);border-color:var(--muted2)}
  .layout{display:flex;flex:1;min-height:0}
  /* sidebar */
  .side{width:380px;flex:0 0 380px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);min-height:0}
  .filters{padding:12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
  .search{width:100%;padding:9px 11px;background:var(--panel2);border:1px solid var(--border);
    border-radius:var(--radius-sm);color:var(--fg);outline:none}
  .search:focus{border-color:var(--accent)}
  .tabs{display:flex;gap:6px}
  .tab{flex:1;padding:7px 6px;font-size:12.5px;text-align:center;background:var(--panel2);
    border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted)}
  .tab.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .toggle input{accent-color:var(--accent)}
  .list{overflow:auto;flex:1;min-height:0}
  .row{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
  .row:hover{background:var(--panel2)}
  .row.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .row.done{opacity:.5}
  .row .num{font-size:11px;color:var(--muted2);width:18px;flex:0 0 18px;padding-top:2px}
  .row .body{flex:1;min-width:0}
  .row .name{font-weight:600;display:flex;align-items:center;gap:6px}
  .row .firm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:11.5px;color:var(--muted2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .star{color:var(--amber)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .dot.verified{background:var(--green)} .dot.partial{background:var(--amber)} .dot.needs_research{background:var(--muted2)}
  .pill{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  .pill.unb{color:var(--green);border-color:#14532d;background:#0b2417}
  .pill.coll{color:var(--amber);border-color:#3f2d09;background:#241a07}
  .check{color:var(--green);font-size:13px}
  /* detail */
  .detail{flex:1;overflow:auto;min-height:0;padding:22px 26px}
  .empty{display:flex;height:100%;align-items:center;justify-content:center;color:var(--muted2);text-align:center;padding:30px}
  .d-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .d-name{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
  .d-firm{color:var(--muted);margin-top:2px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;min-width:108px}
  .stat .k{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-size:19px;font-weight:700;margin-top:3px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .note{font-size:13.5px;color:var(--muted);line-height:1.5}
  .warn{border-color:#3f2d09;background:#1a1206}
  .warn .note{color:#f0c674}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:10px 15px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel2);
    display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .btn:hover{border-color:var(--muted2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .btn.green{background:#0b2417;border-color:#14532d;color:#4ade80}
  .btn.disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:7px 11px;font-size:13px}
  .src{font-size:11.5px;color:var(--muted2);margin-top:8px}
  .script{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:var(--panel2);
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;color:#e4e4e7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .stars{display:flex;gap:4px;font-size:24px}
  .stars span{color:var(--muted2);cursor:pointer;line-height:1}
  .stars span.on{color:var(--amber)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
  .seg button{padding:7px 13px;background:var(--panel2);border:0;border-right:1px solid var(--border);font-size:13px;color:var(--muted)}
  .seg button:last-child{border-right:0}
  .seg button.on-y{background:#0b2417;color:#4ade80}
  .seg button.on-n{background:#2a0f0f;color:#f87171}
  .seg button.on-u{background:var(--panel);color:var(--fg)}
  textarea{width:100%;min-height:80px;background:var(--panel2);border:1px solid var(--border);
    border-radius:var(--radius-sm);color:var(--fg);padding:10px;font:inherit;resize:vertical;outline:none}
  textarea:focus{border-color:var(--accent)}
  .field{margin-bottom:14px}
  .field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--border);padding:11px 18px;border-radius:var(--radius-sm);box-shadow:0 8px 30px rgba(0,0,0,.5);
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .back{display:none}
  @media(max-width:820px){
    .side{width:100%;flex:1 1 auto}
    .detail{display:none}
    body.detailopen .side{display:none}
    body.detailopen .detail{display:block;flex:1}
    .back{display:inline-flex}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <div class="nav">
    <div class="brand">Recovery Remodel <span>· Dialer</span></div>
    <div class="spacer"></div>
    <a class="doclink" href="/scalar" target="_blank">API · Scalar</a>
    <a class="doclink" href="/swagger" target="_blank">Swagger</a>
    <a class="doclink" href="/openapi.json" target="_blank">openapi.json</a>
  </div>

  <div class="layout">
    <aside class="side">
      <div class="filters">
        <input id="search" class="search" placeholder="Search name, firm, role…" />
        <div class="tabs" id="tabs">
          <div class="tab active" data-status="all">All</div>
          <div class="tab" data-status="not_called">Not called</div>
          <div class="tab" data-status="called">Called</div>
          <div class="tab" data-status="favorites">★ Saved</div>
        </div>
        <label class="toggle"><input type="checkbox" id="hideUnavail" /> Hide "not available to hire"</label>
      </div>
      <div class="list" id="list"></div>
    </aside>

    <main class="detail" id="detail">
      <div class="empty">Select a prospect to see their script, contact options, and call notes.</div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const api = (p,opt)=>fetch(p,opt).then(r=>r.json());
const money = v => v==null ? "—" : "$"+Number(v).toLocaleString();
const esc = s => (s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state = { status:"all", q:"", hideUnavail:false, selected:null, items:[] };
let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800); }

async function load(){
  const params = new URLSearchParams();
  if(state.status) params.set("status",state.status);
  if(state.q) params.set("q",state.q);
  if(state.hideUnavail) params.set("hideUnavailable","true");
  const data = await api("/api/prospects?"+params.toString());
  state.items = data.prospects||[];
  renderList();
}

function statusDotClass(c){ return c==="verified"?"verified":c==="partial"?"partial":"needs_research"; }

function renderList(){
  const list = $("#list");
  if(!state.items.length){ list.innerHTML='<div class="empty" style="height:auto;padding:30px">No prospects match.</div>'; return; }
  list.innerHTML = state.items.map(p=>{
    const called = (p.callCount||0)>0;
    return `<div class="row ${called?'done':''} ${state.selected===p.id?'active':''}" data-id="${p.id}">
      <div class="num">${p.rank}</div>
      <div class="body">
        <div class="name">${called?'<span class="check">✓</span>':''}${esc(p.fullName)}
          ${p.favorite?'<span class="star">★</span>':''}
          <span class="dot ${statusDotClass(p.contactStatus)}" title="contact: ${p.contactStatus}"></span></div>
        <div class="firm">${esc(p.firm||"— no firm on record —")}</div>
        <div class="meta">
          <span>${p.permitCount} permits</span><span>${money(p.avgCost)} avg</span>
          ${p.isUnbundledCandidate?'<span class="pill unb">unbundled</span>':''}
          ${p.collisionRisk?'<span class="pill coll">verify identity</span>':''}
          ${p.rating?`<span>${'★'.repeat(p.rating)}</span>`:''}
        </div>
      </div></div>`;
  }).join("");
  list.querySelectorAll(".row").forEach(r=>r.onclick=()=>select(r.dataset.id));
}

function gmailUrl(p){
  const subject = "Permit-only drawings — SF kitchen + structural wall + plumbing fix";
  const body =
`Hi ${p.firstName},

I'm a homeowner in San Francisco planning a kitchen remodel that involves opening a structural wall and correcting a plumbing defect in the main waste stack.

I came across your work going through SF DBI permit records — you've filed a number of single-family ${p.scopeKeywords?("("+p.scopeKeywords.split(",").slice(0,3).join(", ").trim()+") "):""}permits recently, which lines up closely with my project.

I already have a general contractor and a structural engineer lined up; what I'm missing is a permit-ready drawing set. Do you take permit-only / unbundled work, and would you have capacity in the next few weeks? Happy to send the scope and the engineer's prelim.

Thanks,
Justin`;
  return "https://mail.google.com/mail/?view=cm&fs=1"
    + (p.email?("&to="+encodeURIComponent(p.email)):"")
    + "&su="+encodeURIComponent(subject)
    + "&body="+encodeURIComponent(body);
}

async function select(id){
  state.selected = id;
  document.body.classList.add("detailopen");
  renderList();
  const p = await api("/api/prospects/"+id);
  renderDetail(p);
}

function seg(label, key, val, p){
  const mk=(v,cls,txt)=>`<button class="${val===v?cls:''}" data-seg="${key}" data-val="${v}">${txt}</button>`;
  return `<div class="field"><label>${label}</label><div class="seg">
    ${mk(true,"on-y","Yes")}${mk(false,"on-n","No")}${mk(null,"on-u","Unknown")}</div></div>`;
}

function renderDetail(p){
  const phoneBtn = p.phone
    ? `<a class="btn primary" href="tel:${esc(p.phone.replace(/[^0-9+]/g,''))}">📞 Call ${esc(p.phone)}</a>`
    : `<a class="btn disabled" href="https://dbiweb02.sfgov.org/dbipts/default.aspx?page=ApplicantSearch" target="_blank" title="No verified number">📞 No verified number — look up on DBI</a>`;
  const emailBtn = `<a class="btn ${p.email?'':'disabled'}" href="${gmailUrl(p)}" target="_blank" onclick="markEmailed('${p.id}')">✉️ ${p.email?('Email via Gmail'):'Draft email (add address)'}</a>`;
  const siteBtn = p.website?`<a class="btn" href="${esc(p.website)}" target="_blank">🌐 Website</a>`:"";

  const contactCaveat = [
    p.phone&&p.phoneSource?`Phone source: ${esc(p.phoneSource)}`:"",
    p.email&&p.emailSource?`Email source: ${esc(p.emailSource)}`:"",
    p.contactStatus==="needs_research"?"No verified contact info yet — use the DBI permit record or CA Architects Board to confirm before reaching out.":""
  ].filter(Boolean).join(" · ");

  $("#detail").innerHTML = `
    <a class="btn sm back" onclick="document.body.classList.remove('detailopen')">← Back</a>
    <div class="d-head">
      <div>
        <h1 class="d-name">${esc(p.fullName)}</h1>
        <div class="d-firm">${esc(p.firm||"— no firm on record —")} · ${esc(p.roles)}</div>
        <div class="badges">
          ${p.isUnbundledCandidate?'<span class="pill unb">unbundled candidate</span>':''}
          ${p.collisionRisk?'<span class="pill coll">⚠ common name — verify identity</span>':''}
          <span class="pill">contact: ${p.contactStatus}</span>
          <span class="pill">rank #${p.rank}</span>
        </div>
      </div>
      <button class="btn sm" onclick="toggleFav('${p.id}',${!p.favorite})">${p.favorite?'★ Saved':'☆ Save'}</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">Matching permits</div><div class="v">${p.permitCount}</div></div>
      <div class="stat"><div class="k">Avg cost</div><div class="v">${money(p.avgCost)}</div></div>
      <div class="stat"><div class="k">Median cost</div><div class="v">${money(p.medianCost)}</div></div>
      <div class="stat"><div class="k">Calls logged</div><div class="v">${p.callCount||0}</div></div>
    </div>

    ${p.licenseNote?`<div class="card ${p.collisionRisk?'warn':''}"><h3>Notes &amp; verification</h3><div class="note">${esc(p.licenseNote)}</div></div>`:""}

    <div class="card">
      <h3>Reach out</h3>
      <div class="actions">${phoneBtn}${emailBtn}${siteBtn}</div>
      ${contactCaveat?`<div class="src">${contactCaveat}</div>`:""}
      ${p.emailedAt?`<div class="src">✉️ Marked emailed: ${esc(p.emailedAt)}</div>`:""}
    </div>

    <div class="card">
      <h3>Call script (tailored)</h3>
      <div class="script" id="script">${esc(p.callScript)}</div>
      <div class="actions" style="margin-top:10px"><button class="btn sm" onclick="copyScript()">Copy script</button></div>
    </div>

    <div class="card">
      <h3>Log the call</h3>
      <div class="actions">
        <button class="btn sm" onclick="logCall('${p.id}','no_answer')">No answer</button>
        <button class="btn sm" onclick="logCall('${p.id}','voicemail')">Left voicemail</button>
        <button class="btn sm green" onclick="logCall('${p.id}','connected')">✓ Connected</button>
        <button class="btn sm" onclick="logCall('${p.id}','callback')">Callback set</button>
      </div>
      <div class="src">Current status: <b>${esc(p.disposition)}</b>${p.lastContactedAt?` · last contacted ${esc(p.lastContactedAt)}`:""}</div>
    </div>

    <div class="card">
      <h3>Rate &amp; qualify</h3>
      <div class="grid2">
        <div class="field"><label>Rating</label>
          <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<span class="${p.rating>=n?'on':''}" data-star="${n}">★</span>`).join("")}</div>
        </div>
        <div></div>
        ${seg("Available to hire","availableToHire",p.availableToHire,p)}
        ${seg("Good feeling","goodFeeling",p.goodFeeling,p)}
      </div>
      <div class="field"><label>Notes</label>
        <textarea id="notes" placeholder="What they said, rate quoted, availability, vibe…">${esc(p.notes||"")}</textarea>
        <div class="actions" style="margin-top:10px"><button class="btn sm primary" onclick="saveNotes('${p.id}')">Save notes</button></div>
      </div>
    </div>
  `;

  $("#stars").querySelectorAll("span").forEach(s=>s.onclick=()=>patch(p.id,{rating:Number(s.dataset.star)}));
  $("#detail").querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{
    let v = b.dataset.val; v = v==="true"?true:v==="false"?false:null;
    patch(p.id,{[b.dataset.seg]:v});
  });
}

async function patch(id,body){
  await api("/api/prospects/"+id+"/state",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  toast("Saved");
  const p = await api("/api/prospects/"+id); renderDetail(p); await load();
}
async function logCall(id,outcome){
  await api("/api/prospects/"+id+"/call",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({outcome})});
  toast(outcome==="connected"?"Connected — logged":"Call logged");
  const p = await api("/api/prospects/"+id); renderDetail(p); await load();
}
async function saveNotes(id){ await patch(id,{notes:$("#notes").value}); }
async function toggleFav(id,val){ await patch(id,{favorite:val}); }
async function markEmailed(id){ await api("/api/prospects/"+id+"/emailed",{method:"POST"}); setTimeout(load,400); }
function copyScript(){ navigator.clipboard.writeText($("#script").textContent).then(()=>toast("Script copied")); }
window.markEmailed=markEmailed; window.logCall=logCall; window.saveNotes=saveNotes;
window.toggleFav=toggleFav; window.copyScript=copyScript;

$("#search").oninput = e=>{ state.q=e.target.value; clearTimeout(window._s); window._s=setTimeout(load,180); };
$("#hideUnavail").onchange = e=>{ state.hideUnavail=e.target.checked; load(); };
$("#tabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  $("#tabs .tab.active").classList.remove("active"); t.classList.add("active");
  state.status=t.dataset.status; load();
});

load();
</script>
</body>
</html>

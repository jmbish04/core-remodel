name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/appsscript/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Authenticate Clasp
        run: echo "$CLASP_JSON" > ~/.clasprc.json
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}

      - name: Push Code to Apps Script
        run: |
          # If your .clasp.json is inside src/appsscript, keep the next line.
          # If you used the rootDir fix in step 1, remove the "cd" line entirely.
          cd src/appsscript
          clasp push --force
